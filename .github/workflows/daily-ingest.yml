name: Daily ingest

on:
  schedule:
    # TEMPORARY - every 15 min, every day, to catch a live filing landing and confirm the
    # automated pipeline picks it up. Not restricted to weekday business hours (even though
    # real Senate filed_at data shows that's where 95% of filings happen) since it's
    # currently a weekend and the goal right now is to observe one soon, not be efficient.
    # Revert to the daily "17 11 * * *" schedule once verified.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: daily-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python -m src.ingest.run_all
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
