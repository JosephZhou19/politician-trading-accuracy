name: Daily price trickle

on:
  schedule:
    # ~5:30pm ET, weekdays only - after the 4:00pm ET market close, with a half-hour buffer
    # for yfinance's own daily bar to settle. ET below is EDT (UTC-4); drifts 1hr during EST
    # (~Nov-Mar) since cron doesn't adjust - fine here, this job isn't time-sensitive within
    # an hour. No weekend runs: US markets are closed, so a weekend check would just spend
    # quota re-confirming Friday's close.
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: daily-price-trickle
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    # scripts.update_ticker_daily_prices self-limits to a 30-minute budget and is cheap
    # enough in steady state (batched yfinance calls, a small overlap window per ticker)
    # that this timeout is a generous backstop, not the primary defense against a slow run.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      # All yfinance, no other API keys needed (this workflow no longer talks to Finnhub -
      # see scripts/update_ticker_daily_prices.py's docstring for why that job was retired).
      # backfill_spy_benchmark is incremental (a handful of rows in steady state, not the
      # whole ~3,500-row history) so this stays fast day to day; the one-time full-history
      # catch-up (backfill_ticker_daily_prices) was run manually first. The old per-trade
      # point-price backfill (backfill_prices) is gone entirely - ticker_daily_prices now
      # answers any price question at any horizon, computed during local analysis instead of
      # pre-computed at write time (see PLAN.md).
      - run: python -m scripts.backfill_spy_benchmark
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      # Last: keeps ticker_daily_prices current AND derives ticker_status (delisting
      # tracking) from the same fetch (replaces the old Finnhub trickle entirely).
      - run: python -m scripts.update_ticker_daily_prices
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
