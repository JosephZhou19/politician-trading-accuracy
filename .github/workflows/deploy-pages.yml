name: Deploy website

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - "scripts/export_website_data.py"
      - "src/analysis/legislator_metadata.py"
      - ".github/workflows/deploy-pages.yml"
  schedule:
    # ~6pm ET, after the daily price trickle (5:30pm ET) has had time to land, so the site
    # picks up that day's prices and any newly-ingested filings.
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      # A GitHub Actions runner starts with no local file at all each run, which would make
      # sync_local_mirror's own "incremental, not a repeated full-table read" design pointless
      # here specifically: sync_ticker_daily_prices treats a mirror with no watermarks as a
      # first-ever sync and does a full pull across all ~3,500 tickers (see its docstring) -
      # by far the most expensive read path in the whole pipeline. Restoring the previous
      # run's db file first keeps every run after the first genuinely incremental. Save key
      # includes run_id so it's always a new cache entry (an exact-key hit would skip saving
      # the updated file); restore-keys falls back to the most recent prior entry by prefix.
      - uses: actions/cache/restore@v4
        with:
          path: data/congress_trades.db
          key: mirror-db-${{ github.run_id }}
          restore-keys: mirror-db-

      - run: python -m scripts.sync_local_mirror --db data/congress_trades.db
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/congress_trades.db
          key: mirror-db-${{ github.run_id }}

      - run: python -m scripts.export_website_data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
