name: Deploy website

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - "scripts/export_website_data.py"
      - "src/analysis/legislator_metadata.py"
      - ".github/workflows/deploy-pages.yml"
  schedule:
    # ~6pm ET, after the daily price trickle (5:30pm ET) has had time to land, so the site
    # picks up that day's prices and any newly-ingested filings.
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      # Builds a fresh local sqlite mirror from Turso in the runner, then exports static
      # JSON from THAT - never a live query against Turso per site visitor. Same two
      # scripts used for local development, just run here on a schedule instead of by hand.
      - run: python -m scripts.sync_local_mirror --db data/congress_trades.db
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - run: python scripts/export_website_data.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
